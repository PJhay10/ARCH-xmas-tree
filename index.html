<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Tree Challenge</title>
<style>
:root{--bg:#eaf4ff;--card:#fff;--tx:#12305c;--mut:#5f7fa8;--ac:#1e63d6;--gd:#e0a800;--bd:#b9d4f5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(#fff 0%,#dff0ff 35%,#8ecbff 100%) fixed;color:var(--tx);font:16px system-ui,sans-serif}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
button{font:inherit;color:var(--tx);background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--ac)}button:disabled{opacity:.4;cursor:not-allowed}
.go{background:var(--ac);border-color:var(--ac);color:#fff}.bad{background:#d84343;border-color:#d84343;color:#fff}
.corner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));z-index:5}.l{left:10px}.r{right:10px}
.home{text-align:center;padding:12vh 16px 0}.home h1{font-size:clamp(30px,7vw,56px);margin:4px 0 6px;background:linear-gradient(90deg,#1e63d6,#4aa3ff,#1e63d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{font-size:48px;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}
.co{display:block;margin:0 auto 6px;width:110px;height:110px;border-radius:24px;background:#fff;box-shadow:0 10px 30px #1e63d633,0 0 0 4px #bcd9f8}
.team{font-size:28px;font-weight:700;width:210px;padding:30px 20px;margin:14px;border-radius:24px;display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:0 12px 32px #1e63d644;transition:.2s;color:#fff}.team:hover{transform:translateY(-5px) scale(1.04)}.team small{font-size:14px;font-weight:400;opacity:.92}
.ta{background:linear-gradient(160deg,#3b82f6,#0f3f9e);border-color:#7fb0ff}.tb{background:linear-gradient(160deg,#5fd0ff,#0277bd);border-color:#a5e3ff}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px 10px 64px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--bd);padding:6px 14px;border-radius:20px;font-weight:700;color:var(--ac)}
.msg{text-align:center;padding:8px 16px;min-height:42px}
.play{display:flex;gap:12px;justify-content:center;align-items:flex-start;padding:0 12px;flex-wrap:wrap}
.stagew{flex:1 1 600px;max-width:780px;min-width:280px}
svg.tree{width:100%;height:auto;max-height:calc(100vh - 200px);display:block;border-radius:18px;background:linear-gradient(#a9d4ff,#eef7ff);box-shadow:0 12px 40px #1e63d633,inset 0 0 0 2px #fff;cursor:crosshair}
.frame{border:10px solid var(--gd);border-radius:6px;padding:8px;background:#fff;box-shadow:0 8px 30px #1e63d633}.frame .ft{text-align:center;font-weight:700;padding-bottom:6px}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:250px;max-height:calc(100vh - 200px);overflow:auto;align-content:start}.pal>.mut,.pal>.sw{grid-column:1/-1}
.pal button{display:flex;flex-direction:column;gap:2px;align-items:center;font-size:12px;padding:6px 2px}
.pal>button.on{background:#dcebff;border-color:var(--ac)}
.sw{display:flex;gap:7px;flex-wrap:wrap}.sw button{width:28px;height:28px;padding:0;border-radius:50%;border:1px solid #8fb0dc;justify-content:center}
.sw button.on{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--tx)}.sw button.on::after{content:"✓";color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;font-weight:700;font-size:14px}
.lock{opacity:.45;pointer-events:none}
.ctl{display:flex;gap:14px;justify-content:center;align-items:center;padding:12px;flex-wrap:wrap}
.wrap{max-width:900px;margin:auto;padding:0 12px 30px;display:grid;gap:12px}
.card{background:#fffffff2;border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 8px 24px #1e63d622}.card h3{margin:0 0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}.mut{color:var(--mut)}
input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--tx);width:100%;margin:4px 0}
input[type=number]{width:80px}input[type=range]{width:130px;padding:0}
#modal .mb{position:fixed;inset:0;background:#12305c88;display:grid;place-items:center;z-index:9}#modal .card{width:min(340px,90vw)}
.er{color:#d84343;min-height:20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:9}
.who{width:150px;align-self:flex-start;padding:12px}.nm{font-size:14px;padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm.me{color:var(--ac);font-weight:700}
.chat{width:min(780px,calc(100% - 24px));margin:6px auto 24px;background:#fffffff2;border:1px solid var(--bd);border-radius:14px;padding:10px}
#msgs{height:120px;overflow:auto;font-size:14px;display:flex;flex-direction:column;gap:3px;margin-bottom:8px}.m b{color:var(--ac)}.mine b{color:#2e8b57}.m audio{height:32px;max-width:100%;display:block;margin-top:2px}
.crow{display:flex;gap:8px}.crow input{margin:0}
.cert{max-width:760px;margin:0 auto 12px;background:linear-gradient(#fff,#f1f8ff);border:10px double var(--gd);border-radius:12px;padding:22px 24px;text-align:center;box-shadow:0 12px 40px #1e63d633}
.cert h2{margin:6px 0;font-family:Georgia,serif;font-size:clamp(24px,5vw,38px);color:var(--ac)}.cert .sub{color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-size:13px;margin:6px 0}
.cert .tm2{font-size:30px;font-weight:700;margin:4px 0 10px}.cert svg.tree{max-height:300px;box-shadow:0 0 0 2px #bcd9f8}
.cert ul{list-style:none;padding:0;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center}.cert li small{color:var(--mut)}.cert img{width:64px;border-radius:12px}.flakes{font-size:22px;letter-spacing:10px;color:#7fb0ff}
.ann{overflow:hidden}.annbox{position:relative;z-index:2;background:#fff;border-radius:28px;padding:36px 30px;text-align:center;max-width:min(620px,92vw);animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.annbox h1{font-size:clamp(30px,7vw,60px);margin:6px 0 10px;line-height:1.1}.annbox p{font-size:clamp(16px,2.4vw,22px);color:var(--mut);margin:0 0 20px}.annbox .big{font-size:clamp(64px,14vw,110px)}
.win .annbox{border:8px solid var(--gd);box-shadow:0 0 80px #ffd54acc}.win h1{color:#1e63d6}.lose .annbox{border:6px solid #9ed3ff;box-shadow:0 0 60px #9ed3ff99}.lose h1{color:#12305c}
.cf{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:fall linear infinite}@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}@keyframes pop{from{transform:scale(.4);opacity:0}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}#snow,#modal,.bar,.msg,.who,.chat,.ctl,.noprint,.corner{display:none!important}body{background:#fff}.cert{box-shadow:none;margin-top:0}}
</style></head><body>
<button id="mute" class="corner l" onclick="mutef()">🔊</button>

/* music */
let ac,mg,mu=false;const N={C:262,D:294,E:330,F:349,G:392};
const M=[["E",1],["E",1],["E",2],["E",1],["E",1],["E",2],["E",1],["G",1],["C",1.5],["D",.5],["E",4],["F",1],["F",1],["F",1.5],["F",.5],["F",1],["E",1],["E",1],["E",.5],["E",.5],["E",1],["D",1],["D",1],["E",1],["D",2],["G",2]];
function music(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=mu?0:1;mg.connect(ac.destination);const loop=()=>{let t=ac.currentTime+.1;M.forEach(([n,b])=>{const o=ac.createOscillator(),g=ac.createGain(),d=b*.4;o.type="triangle";o.frequency.value=N[n];g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d-.03);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d);t+=d});setTimeout(loop,(t-ac.currentTime)*1000)};loop()}
function mutef(){mu=!mu;$("#mute").textContent=mu?"🔇":"🔊";if(!ac&&!mu)music();if(mg)mg.gain.value=mu?0:1}
document.addEventListener("pointerdown",()=>{if(!ac&&!mu)try{music()}catch(e){}},{once:true});
/* login */
function login(t){const ad=t=="admin";$("#modal").innerHTML=`<div class="mb"><form class="card" onsubmit="doLogin('${t}');return false"><h3>${ad?"Admin login":TN(t)+" login"}</h3><input id="f1" placeholder="${ad?"Username":"Your name"}" autocomplete="off"><input id="f2" type="password" placeholder="${ad?"Password":"Team password"}"><div id="er" class="er"></div><div class="row"><button type="button" onclick="closeM()">Cancel</button><button class="go">Enter</button></div></form></div>`;$("#f1").focus()}
const closeM=()=>$("#modal").innerHTML="";const err=m=>$("#er").textContent=m;
function doLogin(t){if(!ready)return err("Connecting to the game… try again in a moment");const a=$("#f1").value.trim(),p=$("#f2").value;
if(t=="admin"){if(a==S.admin.u&&p==S.admin.p){closeM();go("admin")}else err("Wrong username or password")}
else{if(!a)return err("Please enter your name");if(p!==S.pw[t])return err("Wrong team password");let n=a.replace(/[.$#\[\]\/<>&"']/g,"")||"Player",k=2;const b=n;while(S.roster[t].includes(n))n=b+" "+k++;FB.set("roster/"+t+"/"+n,true);FB.set("members/"+t+"/"+n,true);FB.disc("roster/"+t+"/"+n);me={t,n,last:null};closeM();go("game")}}
function leave(){if(rec_)rec_.stop();if(me){FB.rm("roster/"+me.t+"/"+me.n);me=null}cur.cat=null;closeM();go("home")}

function homeH(){return `<button class="corner r" onclick="login('admin')">Admin</button><div class="home"><img class="co" alt="Arch" src="${LOGO}"><div class="logo">🎄</div><h1>Christmas Tree Challenge</h1><p class="mut">Two teams. One bare tree each. Beat the clock!</p><div class="row"><button class="team ta" onclick="login('A')">❄️ ${TN("A")}<small>Join with your team password</small></button><button class="team tb" onclick="login('B')">⛄ ${TN("B")}<small>Join with your team password</small></button></div></div>`}
function msgH(){const t=me.t,s=S.status;if(s=="idle")return "Waiting for the game master to press Start…";if(s=="paused")return "⏸ Paused – hang tight!";if(s=="running")return "Pick a design on the right, then click the tree to stick it on.";
if(!S.winner)return "🎄 Time’s up! The game master is now evaluating the trees.";return S.winner==t?`🏆 Congratulations, ${TN(t)}! Your tree has been chosen as this year’s winner.`:`Thank you, ${TN(t)}, for a beautiful tree! This year’s winning team is ${TN(S.winner)}.`}

const chatH=t=>`<div class="chat"><div id="msgs">${msgsH(t)}</div><div class="crow"><button id="mic" onclick="rec()" title="Record a voice message (up to 15 seconds)">${rec_?"⏹":"🎤"}</button><input id="ci" maxlength="200" placeholder="Message your team…" autocomplete="off" onkeydown="if(event.key=='Enter')sendMsg()"><button class="go" onclick="sendMsg()">Send</button></div></div>`;
let rec_=null;
async function rec(){if(rec_){rec_.stop();return}
if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Voice messages aren’t supported on this browser");
try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mt=["audio/webm;codecs=opus","audio/mp4","audio/webm"].find(t=>MediaRecorder.isTypeSupported(t));
const r=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:16000}:{audioBitsPerSecond:16000}),ch=[];let sec=0;rec_=r;r.ondataavailable=e=>ch.push(e.data);
const tk=setInterval(()=>{sec++;const x=$("#mic");if(x)x.textContent="⏹ "+sec+"s";if(sec>=15)r.stop()},1000);
r.onstop=()=>{clearInterval(tk);st.getTracks().forEach(t=>t.stop());rec_=null;const x=$("#mic");if(x)x.textContent="🎤";const fr=new FileReader();
fr.onload=()=>{if(!me)return;if(fr.result.length>300000)return toast("That message is too long");FB.push("chat/"+me.t,{n:me.n,a:fr.result,ts:now()})};fr.readAsDataURL(new Blob(ch,{type:r.mimeType}))};
r.start();const x=$("#mic");if(x)x.textContent="⏹ 0s"}catch(e){rec_=null;toast("Microphone blocked. Allow it in your browser.")}}
function sendMsg(){const i=$("#ci"),v=i.value.trim();if(!v||!me)return;FB.push("chat/"+me.t,{n:me.n,t:v.slice(0,200),ts:now()});i.value=""}

function ghost(p){const g=$("#gh");if(!g)return;lp=p;g.innerHTML=p&&S.status=="running"&&cur.cat?`<g opacity=".55" transform="translate(${p.x} ${p.y}) rotate(${cur.rot}) scale(${cur.size})">${D[cur.cat](cur.col)}</g>`:""}
function bindStage(){const sv=$("#stg");if(!sv)return;const pt=e=>{const p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(sv.getScreenCTM().inverse())};
sv.onpointermove=e=>ghost(pt(e));sv.onpointerleave=()=>ghost(null);
sv.onclick=e=>{if(S.status!="running"||!cur.cat)return;const p=pt(e);me.last=FB.push("items/"+me.t,{k:cur.cat,c:cur.col,s:cur.size,r:cur.rot,x:Math.round(p.x),y:Math.round(p.y),o:me.n});upd()}}

/* reset vote */
function askReset(){const t=me.t;if(S.status!="running"||S.vote[t])return;const vs={};S.roster[t].forEach(n=>vs[n]=true);FB.set("vote/"+t,{by:me.n,end:now()+20000,voters:vs,yes:{[me.n]:true}})}
function cast(t,n,y){const v=S.vote[t];if(!v||!v.voters.includes(n)||v.yes.includes(n)||v.no.includes(n))return;FB.set("vote/"+t+"/"+(y?"yes":"no")+"/"+n,true)}
const vote=y=>cast(me.t,me.n,y);
function check(t,force){const v=S.vote[t];if(!v)return;if(!force&&v.yes.length+v.no.length<v.voters.length)return;const ok=v.yes.length>v.no.length,u={vote:null};u["note/"+t]={txt:`${v.yes.length} agreed, ${v.no.length} disagreed. ${ok?"The design was reset.":"The design was kept."}`,until:now()+4500};if(ok)u["items/"+t]=null;FB.upd(u)}
const conf=()=>Array.from({length:80},(_,i)=>`<i class="cf" style="left:${Math.random()*100}%;background:${["#1e63d6","#ffd54a","#e53935","#43a047","#fff","#29b6f6"][i%6]};animation-delay:${(Math.random()*2).toFixed(2)}s;animation-duration:${(2.5+Math.random()*2.5).toFixed(2)}s"></i>`).join("");

function chime(w){if(!ac||mu)return;(w?[523,659,784,1047]:[392,330]).forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.18;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.5)})}
function voteUI(){if(scr!="game"||!me)return;const t=me.t,v=S.vote[t],n=S.note[t],m=$("#modal");if(S.status=="ended"&&S.winner&&annDone!=S.winner){m.innerHTML=annH();if(chimed!=S.winner){chimed=S.winner;chime(S.winner==t)}return}
if(v){const done=v.yes.includes(me.n)||v.no.includes(me.n)||!v.voters.includes(me.n);m.innerHTML=`<div class="mb"><div class="card"><h3>${done?"Reset vote in progress":"Reset the whole design?"}</h3><p>${done?"Waiting for teammates…":v.by+" wants to clear the tree and start over. The timer keeps running."}</p><p><b>${v.yes.length}</b> agree · <b>${v.no.length}</b> disagree · ${v.voters.length-v.yes.length-v.no.length} waiting</p>${done?"":'<div class="row"><button class="go" onclick="vote(true)">Agree</button><button class="bad" onclick="vote(false)">Disagree</button></div>'}</div></div>`}
else if(n)m.innerHTML=`<div class="mb"><div class="card"><h3>Vote result</h3><p>${n.txt}</p></div></div>`;else m.innerHTML=""}

/* live sync */
let ready=false,sig="",ckey="",rc=0,annDone=null,chimed=null;

const arr=o=>Object.entries(o||{}).sort((a,b)=>a[0]<b[0]?-1:1).map(([id,v])=>({id,...v}));
const vv=v=>v&&v.by?{by:v.by,end:v.end,voters:Object.keys(v.voters||{}),yes:Object.keys(v.yes||{}),no:Object.keys(v.no||{})}:null;

S.limit=d.limit;S.left=d.left;S.status=d.status;S.endAt=d.endAt||0;S.winner=d.winner||null;S.pw=d.pw;S.admin=d.admin;
S.roster={A:Object.keys((d.roster||{}).A||{}),B:Object.keys((d.roster||{}).B||{})};
S.items={A:arr((d.items||{}).A),B:arr((d.items||{}).B)};
S.vote={A:vv((d.vote||{}).A),B:vv((d.vote||{}).B)};S.members=d.members||{};S.names=d.names||{};S.chat={A:arr((d.chat||{}).A),B:arr((d.chat||{}).B)};S.note={A:(d.note||{}).A||null,B:(d.note||{}).B||null};
ready=true;if(!S.winner){annDone=null;chimed=null}["A","B"].forEach(t=>check(t));refresh()};
function refresh(){if(scr=="game"&&me){if(me.last&&!S.items[me.t].some(i=>i.id==me.last))me.last=null;
const s=JSON.stringify([S.status,S.winner,S.vote[me.t],S.note[me.t],S.names]);if(s!=sig){sig=s;render()}else{const e=$("#its");if(e)e.innerHTML=itemsH(me.t);upd();const w=$("#who");if(w)w.innerHTML=whoH(me.t);

else if(scr=="home")render();else if(scr=="admin"&&!(document.activeElement&&document.activeElement.tagName=="INPUT"))render()}
setInterval(()=>{if(!ready)return;if(S.status=="running"){S.left=Math.max(0,(S.endAt-now())/1000);if(S.left<=0)FB.upd({status:"ended",left:0})}
for(const t of["A","B"]){const v=S.vote[t];if(v&&now()>v.end)check(t,true);const n=S.note[t];if(n&&now()>n.until)FB.rm("note/"+t)}tt()},250);
(()=>{const c=$("#snow"),x=c.getContext("2d");if(!x){c.remove();return}
const d=Math.min(devicePixelRatio||1,2),sp=document.createElement("canvas");sp.width=sp.height=64;const g=sp.getContext("2d");
let q=g.createRadialGradient(32,32,8,32,32,32);q.addColorStop(0,"rgba(90,150,225,.30)");q.addColorStop(1,"rgba(90,150,225,0)");g.fillStyle=q;g.fillRect(0,0,64,64);
q=g.createRadialGradient(32,32,0,32,32,16);q.addColorStop(0,"#fff");q.addColorStop(.6,"rgba(255,255,255,.95)");q.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=q;g.fillRect(0,0,64,64);
let W=0,H=0,F=[],t=0;const mk=top=>{const z=Math.random()**2;return{x:Math.random()*W,y:top?-12:Math.random()*H,r:1.6+z*6.5,v:.35+z*1.7+Math.random()*.25,a:.75+z*.25,p:Math.random()*6.3,s:.4+Math.random()}};
function fit(){W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);F=Array.from({length:Math.max(60,Math.min(170,Math.round(W*H/8000)))},()=>mk(false))}
fit();addEventListener("resize",()=>{if(innerWidth!=W||Math.abs(innerHeight-H)>150)fit()});
(function f(){t+=.016;x.clearRect(0,0,W,H);for(const s of F){s.y+=s.v;s.x+=Math.sin(t*s.s+s.p)*.6+.25;if(s.y>H+12)Object.assign(s,mk(true));if(s.x>W+12)s.x=-12;x.globalAlpha=s.a;x.drawImage(sp,s.x-s.r*2,s.y-s.r*2,s.r*4,s.r*4)}x.globalAlpha=1;requestAnimationFrame(f)})()})();
render();
